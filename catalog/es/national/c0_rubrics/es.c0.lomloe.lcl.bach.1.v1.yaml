  - id: '6'
    name: Criterio 6
    description: Aplicar sistemáticamente los conocimientos ortográficos, gramaticales
      y lingüísticos, con la debida atención a las particularidades del español de
      Canarias, en la realización, autoevaluación y mejora de textos orales y escritos
      propios del ámbito personal, académico y social, con ayuda de un uso autónomo
      del diccionario y otras fuentes de información digitales o impresas, y poniendo
      en práctica distintas estrategias que permitan la mejora de la comunicación
      oral y escrita, de manera que el alumnado pueda identificar y explicar, en contextos
      comunicativos diversos, los rasgos característicos, usos y valores de todas
      las categorías gramaticales en un texto, así como reconocer, explicar e incorporar
      estructuras sintácticas de progresiva dificultad en sus textos, relacionando
      todo ello con la intención y la situación comunicativa, a fin de tomar conciencia
      de la importancia del conocimiento gramatical para el uso correcto de la lengua
      y avanzar en su aprendizaje autónomo. Comprender y valorar las normas de uso
      lingüístico en torno a la expresión del género, para fomentar un uso comunicativo
      de la lengua que, de acuerdo a sus normas gramaticales, sea respetuoso con la
      diferencia de sexos y la igualdad de derechos y deberes entre las personas.
      Este criterio pretende comprobar si el alumnado aplica, sistemáticamente en
      el caso de la morfología y de manera progresiva en lo que concierne a la sintaxis,
      en la realización, autoevaluación y mejora de textos orales y escritos propios
      del ámbito personal, académico o social, conocimientos y normas de uso de la
      lengua para mejorar la adecuación, coherencia y cohesión de sus producciones,
      siempre en relación con la intención comunicativa, la tipología textual y otros
      componentes de la situación comunicativa como la audiencia y el contexto, ayudándose
      para ello de un uso adecuado de diccionarios y fuentes de información en formato
      papel o digital. Para ello, se verificará si, en los procesos de revisión y
      mejora de explica incorrecciones de concordancia, régimen verbal, ambigüedades
      semánticas, etc., utilizando en todo caso la terminología gramatical adecuada
      para ello y si mantiene una atención adecuada a los aspectos relacionados con
      la expresión de las diferencias de género y el fomento de un lenguaje coeducativo.
      Asimismo, se comprobará que identifica y explica los usos y valores en la comunicación
      de sustantivos, adjetivos, verbos, pronombres y determinantes en un texto, y
      si reconoce, explica e incorpora a la comunicación las estructuras, límites
      y funcionamiento de oraciones simples y compuestas (subordinadas sustantivas
      y de relativo), así como distintas modalidades oracionales (activas pasivas,
      impersonales y medias) como estrategias de enriquecimiento y mejora de sus textos,
      en el desarrollo de su autonomía en el aprendizaje.
    levels:
      insuficiente: Aplica, rara vez y sin ser consciente de la importancia de hacerlo,
        sus conocimientos morfológicos y sintácticos al enriquecimiento y a la mejora
        de textos orales o escritos, propios o ajenos, empleando de manera poco adecuada
        diccionarios y otras fuentes de consulta. De esta manera, aun siguiendo identifica
        y explica con dificultad, utilizando rara vez la terminología gramatical adecuada,
        y mostrando un conocimiento insuficiente, los usos y valores de sustantivos,
        adjetivos, verbos, pronombres y determinantes en estos textos, así como de
        estructuras sintácticas de dificultad, que incorpora en sus producciones con
        frecuencia de forma poco pertinente o incorrecta, demostrando que tiene dificultades
        comprender los límites y el funcionamiento de oraciones simples compuestas,
        así como de las distintas oracionales. Además, le cuesta respetar y valorar,
        haciéndolo con automatismo, la expresión de las diferencias de género y no
        suele utilizar un lenguaje coeducativo.
      suficiente_bien: Aplica, frecuentemente aunque con conciencia superficial sobre
        importancia de hacerlo, sus conocimientos morfológicos y sintácticos al enriquecimiento
        y a la mejora de textos orales o escritos, propios o ajenos, empleando adecuadamente
        diccionarios y otras fuentes de instrucciones, consulta. De esta manera, de
        forma pautada, identifica y explica, utilizando terminología adecuada y demostrando
        un conocimiento aceptable de todo ello, los usos y valores de sustantivos,
        adjetivos, verbos, pronombres y determinantes en estos textos, así como de
        progresiva estructuras sintácticas de progresiva dificultad, que incorpora
        en sus producciones aunque no siempre de manera pertinente, para demostrando
        alguna dificultad para comprender los límites las y el funcionamiento de las
        y oraciones simples compuestas, así como de las modalidades distintas modalidades
        oracionales. Además, respeta y valora, aunque con conciencia superficial,
        la expresión de las diferencias de género y utiliza un lenguaje coeducativo.
      notable: Aplica, casi siempre y con cierta conciencia de la la importancia de
        hacerlo, sus conocimientos morfológicos y sintácticos al enriquecimiento y
        a la mejora de textos orales escritos, propios o ajenos, empleando diccionarios
        y otras fuentes de consulta. De esta manera, con algunas identifica y explica,
        utilizando la la terminología gramatical gramatical adecuada y demostrando
        un conocimiento oportuno de todo ello, los usos y valores sustantivos, adjetivos,
        verbos, pronombres y determinantes en estos textos, así como de estructuras
        sintácticas progresiva dificultad, que incorpora en sus producciones con bastante
        pertinencia, demostrando que comprende aceptablemente los límites y el funcionamiento
        de las oraciones simples compuestas, así como de las y distintas oracionales.
        Además, respeta y valora con cierta conciencia la expresión de las diferencias
        de género y utiliza un lenguaje coeducativo.
      sobresaliente: Aplica, casi siempre y con conciencia de la importancia de hacerlo,
        sus conocimientos morfológicos y sintácticos al enriquecimiento y a la mejora
        o de textos orales o escritos, propios o ajenos, empleando adecuadamente adecuadamente
        diccionarios y otras fuentes de consulta. De esta manera, de forma orientaciones,
        autónoma, identifica y explica, utilizando la terminología gramatical adecuada
        y demostrando un conocimiento destacado de de todo ello, los usos y valores
        de sustantivos, adjetivos, verbos, pronombres y determinantes en estos textos,
        así como de de estructuras sintácticas de progresiva dificultad, que incorpora
        en sus producciones con pertinencia, demostrando que comprende notablemente
        los límites y el funcionamiento de las oraciones simples y y compuestas, así
        como de las distintas modalidades modalidades oracionales. Además, respeta
        y valora con conciencia crítica la expresión de las diferencias de género
        y utiliza un lenguaje coeducativo.
  - id: '7'
    name: Criterio 7
    description: Aplicar, en la elaboración de discursos orales y escritos propios
      de los ámbitos académico y social, los conocimientos en torno a la estructura
      y los rasgos lingüísticos de las diferentes tipologías textuales para garantizar
      la adecuación del mensaje a la situación comunicativa y a la intención del emisor,
      la correcta estructuración y disposición de los contenidos para la coherencia
      de sentido, y el manejo de conectores textuales y mecanismos de referencia interna
      para su cohesión, con ayuda de fuentes de información impresa o digital sobre
      el uso correcto de la lengua, en la búsqueda de la mejora en la comunicación
      y del avance en su aprendizaje autónomo. Este criterio permitirá evaluar si
      el alumnado utiliza, con ayuda de fuentes de consulta impresas o digitales,
      para la mejora de la comprensión y composición de textos orales y escritos,
      los elementos lingüísticos y las normas de uso necesarios en el marco del discurso
      comunicativo. Para ello, se constatará si los alumnos y las alumnas reconocen
      y explican, en relación a la intención comunicativa y al resto de condiciones
      de la situación comunicativa, los rasgos estructurales y lingüísticos de diferentes
      tipologías textuales (narración, descripción, exposición y argumentación) en
      los planos morfosintáctico, léxico-semántico y pragmático- textual, incorporando
      los distintos procedimientos de cohesión textual en su propia producción oral
      y escrita (conectores textuales de adición, contraste y explicación; mecanismos
      de referencia interna como elipsis, sustitución pronominal y léxica…), identificando,
      analizando e interpretando las formas gramaticales deícticas que hacen referencia
      al contexto temporal y espacial, y a los participantes en la comunicación (demostrativos,
      adverbios de tiempo y lugar, pronombres personales…), y valorando los recursos
      expresivos empleados por el emisor de un texto, diferenciando y explicando las
      marcas de objetividad y de subjetividad, y los distintos procedimientos gramaticales
      de inclusión del emisor en el mensaje (modalidades del discurso, elección de
      la persona gramatical, el uso de pronombres, el sujeto agente o paciente, las
      oraciones impersonales, los modos, tiempos y formas verbales…). Todo ello en
      la búsqueda de la mejora progresiva de su competencia en comunicación lingüística.
    levels:
      insuficiente: Manifiesta dificultades y conciencia superficial para reconocer
        y explicar, los rasgos estructurales y lingüísticos de las diferentes textuales
        en los planos morfosintáctico, semántico y pragmático- textual. Asimismo,
        aplica con escasa eficacia y poca pertinencia conocimientos en interpretación
        y producción de textos orales y escritos, incorporando a producciones los
        distintos procedimientos de cohesión textual, analizando muchas imprecisiones
        las formas gramaticales deícticas que hacen referencia al contexto temporal
        y espacial, así como a los participantes en la comunicación, valorando con
        escaso acierto y sentido estético los expresivos empleados por el emisor de
        un texto, y diferenciando y explicando las marcas de objetividad y de subjetividad
        y los distintos procedimientos gramaticales de inclusión del emisor en el
        mensaje. Para todo ello utiliza con poca destreza fuentes de consulta impresas
        o digitales.
      suficiente_bien: Reconoce y explica, de manera general y con cierta conciencia,
        los estructurales y lingüísticos de tipologías las diferentes textuales en
        los planos léxico- morfosintáctico, semántico y pragmático- textual. Asimismo,
        aplica con cierta eficacia y pertinencia estos estos conocimientos en la la
        interpretación y producción de textos orales y escritos, incorporando a sus
        producciones los distintos procedimientos de cohesión textual, analizando,
        aunque con con algunas imprecisiones, las formas gramaticales deícticas que
        hacen referencia al contexto temporal y espacial, así como a los participantes
        en la comunicación, valorando generalmente con acierto y sentido estético
        los recursos recursos expresivos empleados por el emisor de un texto, y diferenciando
        y explicando las marcas de objetividad y de subjetividad y los distintos procedimientos
        gramaticales de inclusión del emisor en el mensaje. Para todo ello utiliza
        con cierta destreza fuentes de consulta impresas o digitales.
      notable: Reconoce y explica, con cierta profundidad y conciencia rasgos crítica,
        los rasgos estructurales y lingüísticos de las diferentes tipologías tipologías
        textuales en los planos morfosintáctico, léxico- léxico- semántico y pragmático-
        textual. Asimismo, aplica de manera bastante eficaz y pertinente conocimientos
        en interpretación y producción de textos orales y escritos, sus incorporando
        a producciones los distintos procedimientos de cohesión textual, analizando
