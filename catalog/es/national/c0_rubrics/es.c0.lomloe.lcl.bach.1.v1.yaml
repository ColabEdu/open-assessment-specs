  - id: '5'
    name: Criterio 5
    description: Realizar trabajos de investigación sobre temas del currículo, relacionados
      con la lengua, la literatura desde la Edad Media hasta el siglo XIX o con la
      actualidad social, científica y cultural, en un proceso integral y planificado
      de manera autónoma, que le permita reconocer cuándo necesita información, buscarla,
      gestionarla, evaluarla y comunicarla de forma adecuada al contexto, respetando
      las normas de presentación de estos trabajos y aportando un punto de vista personal,
      crítico y riguroso en sus argumentaciones, a la par que respetuoso con la propiedad
      intelectual de las fuentes consultadas. Utilizar          las tecnologías de
      la información y la comunicación para la realización, evaluación y mejora del
      contenido y de la expresión lingüística de estas producciones. Todo ello para
      propiciar un proceso de aprendizaje continuo y para toda la vida. Se pretende
      comprobar que el alumnado, individualmente o de forma cooperativa, consulta
      fuentes de información variadas en contextos sociales o académicos, para la
      realización de trabajos de investigación (sobre el conocimiento de la lengua,
      sobre los temas, obras y autores y autoras de la literatura desde la Edad Media
      hasta el siglo XIX, o sobre temas de la actualidad social, científica o cultural).
