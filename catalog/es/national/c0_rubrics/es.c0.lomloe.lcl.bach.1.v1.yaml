        diversidad de la lengua como riqueza cultural y patrimonial, y en especial
        la casi norma culta canaria como alternancias, variedad de prestigio, evitando
        siempre alternancias, incorrecciones e inseguridades en su uso formal.'
  - id: '9'
    name: Criterio 9
    description: Leer, analizar e interpretar críticamente fragmentos u obras completas
      representativas de la literatura española, incluida la canaria, desde la Edad
      Media al siglo XlX, con la adecuada atención a las muestras creadas por escritoras
      representativas        de    las     distintas    épocas, identificando sus
      características temáticas y formales, relacionándolas con el contexto histórico,
      social, artístico y cultural, con el movimiento y género al que pertenece y
      con la obra del autor o la autora, constatando a su vez la evolución histórica
      de los temas y las formas. Con este criterio se pretende evaluar la capacidad
      del alumnado para analizar e interpretar críticamente obras literarias significativas
      de la literatura española desde la Edad Media al siglo XIX, con la adecuada
      atención a las muestras creadas por escritoras representativas de las distintas
      épocas y a los autores y a las autoras canarios, en su contexto histórico, social,
      artístico y cultural, reconociendo las características del género en el que
      se inscriben, para relacionarlas con el movimiento y la obra del propio autor
      o autora, comparándolas a su vez con otras obras de la época o de épocas diferentes
      que presenten algún vínculo con ellas, constatando la presencia de determinados
      temas y formas, y la evolución en la manera de tratarlos. Para ello el alumnado
      participará en situaciones comunicativas, propias del ámbito académico, personal
      y social (debates, mesas redondas…) que favorezcan el intercambio de opiniones
      y perspectivas para retroalimentar las propias, realizará trabajos de diversa
      índole, individuales o en grupo, de análisis e interpretación (trabajos monográficos,
      comentarios de texto, estudios comparativos…), presentados en soporte papel
      o digital. Todo ello con la intención de que el alumnado, realice tanto el estudio
      de la obra, como que continúe enriqueciendo de su biografía lectora, desarrollando
      y fortaleciendo su espíritu crítico y su personalidad literaria.
    levels:
      insuficiente: Analiza textos significativos de la literatura española desde
        la Edad Media al siglo XIX, de manera le cuesta relacionarlos con el contexto
        histórico, social, artístico y cultural en que surgen, así como con el movimiento
        y género al que pertenece, y con la obra del propio autor o autora. Además,
        de forma inadecuada compara estos textos con obras de la época o de otras
        épocas con las que se vinculen de alguna manera, y constata con dificultad
        la presencia de determinados temas y formas, así como la evolución de estos.
        Para ello, participa de manera muy poco activa y con conciencia superficial
        en situaciones comunicativas que favorezcan la emisión de juicios básicos
        y intercambio de opiniones, y realiza trabajos de diversa índole inacabados
        o con imperfecciones notables.
      suficiente_bien: superficialmente Analiza críticamente aunque en términos generales
        textos significativos de la literatura española desde la Edad Media al siglo
        XIX, de manera que los relaciona con el contexto el histórico, social, artístico
        y cultural en el que surgen, así como con el movimiento y género al que pertenece,
        y con la obra del propio autor o autora. Además, de forma aceptable compara
        estos textos con obras de la época o de otras épocas con las que se vinculen
        de alguna manera, y constata la presencia de determinados temas y formas,
        así como la evolución de estos. Para ello, participa con cierta deliberación
        aunque no siempre de manera activa en situaciones comunicativas que favorezcan
        la emisión de el juicios sencillos y el intercambio de opiniones, y realiza
        trabajos de diversa índole que presentan un desarrollo y un acabado aceptable.
      notable: Analiza críticamente profundidad significativos de la literatura española
        desde la Edad Media al siglo XIX, de manera que los relaciona con el contexto
        histórico, social, artístico y cultural en el que surgen, así como con el
        movimiento y género al que pertenece, y con la obra del propio autor o autora.
        Además, de manera bastante pertinente compara estos textos con obras de la
        época o de otras épocas con las que se vinculen de alguna manera, y constata
        la presencia de determinados temas y formas, así como la evolución de estos.
        Para ello, participa forma bastante activa y con deliberación en situaciones
        comunicativas que favorezcan la emisión de juicios de cierta complejidad y
        el intercambio de opiniones, y realiza trabajos de diversa índole presentan
        un desarrollo y un acabado adecuado.
      sobresaliente: en Analiza críticamente, en textos profundidad y con bastante
        precisión, textos significativos de la literatura española desde la Edad Media
        al siglo XIX, de manera que los relaciona con el contexto histórico, social,
        artístico y cultural en el que surgen, así como con el movimiento y género
        al que pertenece, y con la obra del propio autor o autora. Además, de manera
        pertinente y autónoma, compara estos textos con obras de la época o de otras
        épocas con las que se vinculen de alguna manera, y constata la presencia de
        determinados temas y formas, de así como la evolución de estos. Para ello,
        participa de forma activa y con conciencia crítica en situaciones comunicativas
        que favorezcan la emisión de juicios complejos y el intercambio de que opiniones,
        y realiza trabajos de diversa índole que presentan un desarrollo y un acabado
        destacable.
  - id: '10'
    name: Criterio 10
    description: Componer textos personales, en soporte papel o digital, de intención
      literaria y con conciencia de estilo, en los que se apliquen los conocimientos
      literarios y artísticos adquiridos a partir de la lectura y el comentario de
      obras de la literatura española y universal de todos los tiempos, incluida la
      actual, y de su propia experiencia lectora, cultural y personal. Con este criterio
      se pretende comprobar la capacidad del alumnado para utilizar en sus escritos,
      presentados en soporte papel o digital, los conocimientos literarios y artísticos
      adquiridos, mediante la composición de textos con intención literaria y conciencia
      de estilo en los que reflejen su experiencia lectora, además de su bagaje cultural
      y personal, así como a través de la elaboración de trabajos o comentarios críticos
      sobre la lectura de obras completas, con la intención de poner de manifiesto
      la importancia de la lectura y la escritura como fuente de conocimiento y de
      placer, como forma de creación y de comunicación de ideas y de emociones, y
      su vinculación con el resto de las manifestaciones artísticas.
    levels:
      insuficiente: Elabora textos personales sencillos en los que demuestra escasa
        intención literaria y conciencia de estilo, así como trabajos comentarios
        críticos, que presenta inacabados o con imperfecciones notables a partir de
        la lectura de obras fragmentos significativos de la literatura universal,
        española canaria, en los que aplica con escasa fluidez y sin apenas creatividad
        sus conocimientos literarios, además de su bagaje lector, cultural y personal.
      suficiente_bien: Elabora textos personales bien estructurados con intención
        literaria y conciencia de estilo, así como trabajos o o comentarios críticos,
        que presentan un desarrollo y un acabado aceptable a partir de la lectura
        de obras o o fragmentos significativos de la literatura universal, española
        y y canaria, en los que aplica sin dificultades destacables y con algunas
        aportaciones creativas sus conocimientos literarios, además de su bagaje lector,
        cultural y personal.
      notable: Elabora textos personales bastante complejos intención literaria y
        conciencia de estilo, así como trabajos comentarios críticos presentan un
        desarrollo y un acabado adecuado, a partir de la lectura de obras o fragmentos
        significativos de literatura universal, española canaria, en los que aplica
        con bastante precisión creatividad sus conocimientos literarios, además de
        su bagaje lector, cultural y personal.
      sobresaliente: Elabora textos personales con complejos con intención literaria
        y conciencia de estilo, o así como trabajos o que comentarios críticos que
        presentan un desarrollo y un acabado destacable, a partir de la lectura de
        obras o la fragmentos significativos de la y literatura universal, española
        y canaria, en los que aplica con y notable precisión y creatividad sus conocimientos
        literarios, además de su bagaje lector, cultural y personal.
