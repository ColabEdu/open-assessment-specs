  criteria:
  - id: '1'
    name: Criterio 1
    description: Producir textos expositivos y argumentativos orales con rigor y claridad
      en contextos de aprendizaje formal, a partir de un proceso que pasa por la documentación
      en fuentes diversas, la organización de la información mediante esquemas (siguiendo
      un orden preestablecido y teniendo en cuenta los factores de la situación comunicativa
      así como las técnicas de la exposición oral) y la utilización de las Tecnologías
      de la Información y la Comunicación; y desarrollar la escucha activa para resumir
      por escrito el contenido de este tipo de textos, reconociendo la importancia
      de la comunicación oral como un medio para adquirir conocimientos y progresar
      en el aprendizaje autónomo. Con este criterio se pretende evaluar la capacidad
      del alumnado para realizar producciones orales expositivas y argumentativas
      en contextos académicos (entrevistas, disertaciones, conferencias, charlas,
      discursos, debates, videoconferencias…) siguiendo un orden previamente establecido,
      expresándose con fluidez y adaptando la entonación, el tono, timbre y velocidad
      a las condiciones de la situación comunicativa (tema, ámbito discursivo, tipo
      de destinatario…), empleando un léxico preciso y especializado, evitando el
      uso de coloquialismos, muletillas y palabras comodín; consultando fuentes de
      información diversa y utilizando las Tecnologías de la Información y la Comunicación.
      Además comprobaremos que el alumnado desarrolla la escucha activa resumiendo
      por escrito este tipo de textos, discriminando la información relevante, reconociendo
      las distintas formas de organización del contenido académico o de divulgación
      científica y cultural, analizando los recursos verbales y no verbales empleados
      por el emisor y valorándolos en función de los elementos de la situación comunicativa.
      Por último podremos constatar si el alumno o alumna evalúa sus producciones
      y las de sus compañeros, detectando las dificultades estructurales y expresivas
      y diseñando estrategias para mejorar sus prácticas orales y progresar en el
      aprendizaje autónomo.
    levels:
      insuficiente: Planifica y produce con poca claridad, orden y pertinencia textos
        expositivos argumentativos orales a partir la consulta de fuentes de información
        diversa y de la utilización básica y poco responsable de las TIC. En ellos
        rara vez y sin ser consciente de la importancia de aspectos, se expresa con
        fluidez; respeta la dicción y ortofonía la norma culta del español de Canarias;
        adapta la entonación, el tono, el timbre y la velocidad las condiciones de
        la situación comunicativa; emplea un léxico preciso y especializado; y evita
        el uso de coloquialismos, muletillas y palabras comodín. Además, presenta
        dificultades para demostrar que comprende este tipo de textos, de manera los
        resume de manera parcial y fragmentada, pues le cuesta discriminar la información
        relevante. Asimismo, muchas reconoce las distintas formas de organización
        del contenido y analiza los recursos verbales y verbales, valorándolos en
        función de los elementos de la situación comunicativa. Por último, a partir
        de la práctica habitual de la evaluación y la coevaluación, no es capaz de
        mejorar ni sus producciones ni las ajenas.
      suficiente_bien: 'Planifica aunque no siempre de manera pertinente y normalmente
        siguiendo de orientaciones, y produce aunque con errores en lo que respecta
        a la claridad y al orden y pertinencia, textos expositivos y argumentativos
        orales a partir de la consulta de fuentes de estos información diversa y de
        la utilización con cierta eficacia y responsabilidad de las TIC. En de ellos,
        frecuentemente aunque con conciencia superficial de la a importancia de estos
        aspectos: se expresa con fluidez; respeta la dicción y ortofonía de la norma
        culta del español de Canarias; adapta la entonación, el tono, el timbre y
        la velocidad a las condiciones de la situación comunicativa; emplea un léxico
        preciso y especializado; y evita el que uso de coloquialismos, muletillas
        y palabras comodín. Además, demuestra que comprende este tipo de textos, de
        manera que con elabora resúmenes de estos imprecisiones, aunque con algunos
        fallos en los que respecta a la cohesión y no discriminando siempre no información
        relevante. Asimismo, con algunas incorrecciones, reconoce las distintas formas
        de organización del contenido y analiza los recursos verbales y no verbales,
        valorándolos en función de los elementos de la situación comunicativa. Por
        último, a partir de la práctica habitual de la evaluación y la coevaluación,
        mejora con bastante conciencia de los errores detectados tanto sus producciones
        como las ajenas.'
      notable: 'Planifica con y pertinencia y autonomía, y produce con bastante claridad,
        y orden, textos expositivos y argumentativos orales a partir de la consulta
        de fuentes de información diversa y de la utilización bastante eficiente y
        responsable de las TIC. En ellos casi siempre y con cierta conciencia de la
        importancia de estos aspectos: se expresa con fluidez; respeta la dicción
        y ortofonía de la norma culta del español de Canarias; adapta la entonación,
        el tono, el timbre y velocidad a las condiciones de la situación comunicativa;
        emplea un léxico preciso y especializado; y evita el uso de coloquialismos,
        muletillas y palabras comodín. Además, demuestra comprende este tipo de textos,
        de manera que elabora resúmenes de estos bastante cohesionados y completos,
        discriminando la información Asimismo, con precisión, reconoce las distintas
        la formas de organización del contenido y analiza los recursos verbales y
        no valorándolos en función de los elementos de la situación comunicativa.
        Por último, a partir de la práctica habitual de la evaluación y la coevaluación,
        mejora con conciencia de los errores detectados tanto sus producciones como
        las ajenas.'
      sobresaliente: 'bastante Planifica con pertinencia y autonomía, y produce con
        claridad y orden, textos expositivos y argumentativos orales a partir de la
        consulta de fuentes de información diversa y de la utilización eficiente y
        responsable de las TIC. En ellos, siempre y con total conciencia de la importancia
        de estos aspectos: se expresa con fluidez; respeta la dicción y ortofonía
        de la norma culta del español de Canarias: adapta la entonación, el tono,
        el timbre y la velocidad a la las condiciones de la situación comunicativa;
        emplea un léxico preciso y especializado; y evita el uso de coloquialismos,
        muletillas y palabras comodín. Además, demuestra que que comprende este tipo
        de textos, de manera que elabora resúmenes de estos cohesionados y completos,
        discriminando la información relevante. Asimismo, con relevante. precisión,
        reconoce las distintas bastante formas de organización del contenido; y analiza
        los recursos verbales y no verbales, valorándolos en función de los verbales,
        elementos de la situación comunicativa. Por último, a partir de la práctica
        habitual de la evaluación y la coevaluación, mejora con profundidad y conciencia
        de los errores detectados tanto sus producciones como las ajenas.'
  - id: '2'
    name: Criterio 2
    description: Comprender y producir textos orales y audiovisuales procedentes de
      los medios y redes de comunicación social, analizando de forma crítica la intención
      comunicativa, el tema y la estructura del contenido e identificando y aplicando
      los rasgos propios del género periodístico, así como los recursos verbales y
      no verbales, para desarrollar su sentido crítico y consolidar una madurez personal
      y social que le permita participar de forma responsable y asertiva en cualquier
      tipo de interacción social. Con este criterio se evaluará la capacidad del alumno
      o alumna para reconocer los rasgos propios de los principales géneros informativos
      y de opinión a partir del análisis de textos orales o audiovisuales procedentes
      de los medios de comunicación social (reportaje, informativos, tertulias radiofónicas,
      debates televisivos, Usenet, vlogs …) analizando los recursos verbales y no
      verbales utilizados por el emisor y valorando de forma crítica su forma y contenido.
      Asimismo podremos evaluar que el alumnado es capaz de planificar y producir
      textos orales informativos y de opinión, organizando la información relevante
      (fichas, esquemas, mapas conceptuales…), garantizando la coherencia y cohesión
      en la presentación de los contenidos y la pertinencia de los argumentos seleccionados,
      cuando proceda; eligiendo el registro apropiado y apoyándose en las Tecnologías
      de la Información y la Comunicación para guiar a los oyentes y mantener su atención.
    levels:
      insuficiente: Manifiesta dificultades y conciencia superficial para analizar
        y valorar los recursos verbales y no verbales, la forma, el contenido y la
        intención comunicativa de textos orales o audiovisuales procedentes de los
        medios y las redes de comunicación social, reconociendo con muchas imprecisiones
        los rasgos propios de los principales géneros informativos y de opinión. Asimismo
        planifica con escasa eficacia y poca pertinencia la producción de sus propios
        textos orales informativos y de opinión, organizando la información relevante,
        presentando los contenidos con coherencia y cohesión, y seleccionado argumentos
        pertinentes y el registro apropiado, todo ello con poco acierto. Además, apoya
        su exposición en las TIC con poca destreza para guiar a los oyentes y mantener
        su atención. Por último, a partir de la práctica habitual de la evaluación
        y la coevaluación, no es capaz de mejorar ni sus producciones ni las ajenas.
      suficiente_bien: Analiza de manera general y valora con deliberación, los recursos
        verbales y no verbales, la forma, el contenido y la intención comunicativa
        de textos orales o audiovisuales procedentes de los medios y las redes de
        comunicación social, reconociendo aunque con algunas imprecisiones los rasgos
        propios de los principales géneros informativos y de opinión. Asimismo planifica
        con cierta eficacia y pertinencia la producción de sus propios textos orales
        informativos y de opinión, organizando la información relevante, presentando
        los contenidos con coherencia y cohesión, y seleccionado argumentos pertinentes
        y el registro apropiado, todo ello generalmente con acierto. Además, apoya
        su exposición en las TIC con cierta destreza para guiar a los oyentes y mantener
        su atención. Por último, a partir de la práctica habitual de la evaluación
        y la coevaluación, mejora con bastante conciencia de los errores cometidos
        tanto sus producciones como las ajenas.
      notable: Analiza con profundidad y valora con conciencia crítica, recursos verbales
        y verbales, la forma, el contenido y la intención comunicativa de textos orales
        o audiovisuales procedentes de los medios y las redes de comunicación social,
        reconociendo con bastante precisión los rasgos propios de los principales
        informativos y de opinión. Asimismo planifica de manera bastante eficaz y
        pertinente la producción de sus propios textos orales informativos y de opinión,
        organizando información presentando los contenidos con coherencia y cohesión,
        y seleccionado pertinentes y el registro apropiado, todo ello con acierto.
        Además, apoya su exposición en las TIC con bastante destreza para guiar a
        los oyentes y mantener su atención. Por último, a partir la práctica habitual
        de la evaluación y la coevaluación, mejora con cierta conciencia de los errores
        cometidos tanto sus producciones como las ajenas.
      sobresaliente: cierta Analiza con profundidad y valora con conciencia crítica
        y los sentido estético, los recursos no verbales y no verbales, la forma,
        el contenido y la intención comunicativa de textos orales o audiovisuales
        procedentes de los medios y las redes de comunicación social, reconociendo
        con precisión los rasgos propios de los géneros principales géneros informativos
        y de opinión. Asimismo planifica de manera eficaz y pertinente la producción
        de sus propios textos orales informativos y de la opinión, organizando la
        relevante, información relevante, presentando los contenidos con coherencia
        y cohesión, y argumentos seleccionado argumentos pertinentes y el registro
        apropiado, todo ello con gran acierto. Además, apoya su exposición en las
        TIC con destreza para guiar a los oyentes y mantener su de atención. Por último,
        a partir de la práctica habitual de la evaluación y la coevaluación, mejora
        con profundidad y conciencia de los errores cometidos tanto sus producciones
        como las ajenas.
  - id: '3'
    name: Criterio 3
    description: Producir textos escritos expositivos y argumentativos en contextos
      formales de aprendizaje con rigor, claridad y corrección ortográfica y gramatical,
      a partir de un esquema previo, utilizando los recursos expresivos adecuados
      a las condiciones de la situación comunicativa, empleando distintas estructuras
      expositivas (comparación, problema-solución, enumeración, causa-consecuencia,
      ordenación cronológica…) o exponiendo, en su caso, las diversas opiniones que
      se sostienen, adoptando una posición crítica bien argumentada, con el apoyo
      de las Tecnologías de la Información y la Comunicación; así como sintetizar
      el contenido de este tipo de textos discriminando la información relevante y
      accesoria y entendiendo la importancia de la lectura como un medio de adquisición
      de conocimientos y de desarrollo personal. Este criterio nos va a permitir evaluar
      que el alumnado planifica y desarrolla por escrito un tema especializado con
      rigor, claridad y corrección ortográfica y gramatical, ajustando su expresión
      a las condiciones de la situación comunicativa (tema, ámbito discursivo, tipo
      de destinatario…), empleando un léxico preciso y especializado y evitando el
      uso de coloquialismos, muletillas y palabras comodín. Se valorará igualmente
      la coherencia y cohesión en la presentación de los contenidos o la relevancia
      de los argumentos seleccionados en función de la tesis desarrollada, cuando
      proceda. De igual forma el alumno o alumna demostrará que comprende y analiza
      textos escritos de carácter expositivo y argumentativo de tema especializado,
      propios del ámbito académico o de divulgación científica y cultural, identificando
      el tema y la estructura, distinguiendo las ideas principales y secundarias,
      analizando los recursos verbales y no verbales presentes y valorándolos en función
      de los elementos de la situación comunicativa (intención comunicativa del autor,
      tema y género textual). Por último, evalúa sus propias producciones dificultades
      estructurales y expresivas y diseñando     el estrategias para mejorar su redacción
      y avanzar en el aprendizaje autónomo. la
    levels:
      insuficiente: Planifica de manera poco pertinente aun orientaciones y produce
        textos expositivos y argumentativos escritos sobre un tema especializado con
        errores importantes en los que respecta a la claridad y al orden y sin demostrar
        creatividad, a partir de la consulta de fuentes información diversa y de la
        utilización poco eficaz de las TIC, empleando con errores importantes estructuras
        expositivas seleccionando poco relevantes para la defender la tesis desarrollada.
        En ellos en raras ocasiones y sin conciencia de importancia de aspectos, se
        expresa con rigor, claridad y ortográfica y gramatical; presenta los contenidos
        con coherencia y cohesión; se ajusta a las particularidades de la norma culta
        del español de Canarias y a las condiciones de la situación comunicativa;
        y emplea un léxico preciso y especializado, evitando el uso de coloquialismos,
        muletillas y palabras comodín. Además presenta dificultades para analizar
        los recursos verbales no verbales de este tipo de textos y valorarlos en función
        de los elementos de la situación comunicativa, tema y la estructura, así como
        las ideas principales y secundarias. Por último, a partir de la práctica habitual
        de evaluación y la coevaluación, mejora de manera muy superficial tanto sus
        producciones como las ajenas.
      suficiente_bien: Planifica, aunque no siempre con de manera pertinente y normalmente
        siguiendo orientaciones, y produce textos expositivos y argumentativos escritos
        sobre un tema especializado con algunos errores poco importantes en lo que
        respecta a la claridad y al orden, y demostrando cierta de creatividad, a
        partir de la consulta de fuentes información diversa y de la utilización eficaz
        de las TIC, distintas empleando sin errores o importantes argumentos estructuras
        expositivas seleccionando argumentos generalmente relevantes para la defender
        la la desarrollada. En estos habitualmente y con cierta conciencia de la importancia
        corrección de estos aspectos se expresa con rigor, claridad y corrección ortográfica
        y gramatical; presenta los contenidos con coherencia y cohesión; se ajusta
        a las particularidades de la norma culta del español de Canarias y a las condiciones
        de la situación comunicativa; y emplea un léxico preciso y especializado,
        evitando el uso de coloquialismos, muletillas y palabras comodín. Además y
        analiza de manera general los recursos verbales y no verbales de este tipo
        de textos y los valora en función de los identificando elementos de la situación
        con escasas incorrecciones el tema y la estructura, así como las ideas principales
        y secundarias. Por último, a partir de la práctica habitual de la evaluación
        y la coevaluación, mejora con deliberación tanto sus producciones como las
        ajenas.
      notable: 'Planifica con pertinencia y autonomía, y produce textos expositivos
        y argumentativos escritos sobre un tema especializado bastante claros, ordenados
        y con cierta creatividad, a partir de la consulta de fuentes información diversa
        y de la utilización bastante eficiente responsable de las TIC, de empleando
        con acierto distintas estructuras expositivas o seleccionando argumentos distintas
        relevantes para la defender la o tesis desarrollada. En ellos casi siempre
        y con bastante conciencia de la importancia tesis de estos aspectos: se expresa
        ellos con rigor, claridad y corrección ortográfica y presenta los contenidos
        con coherencia y cohesión; se ajusta a las particularidades la norma culta
        del español de Canarias y a las condiciones de la situación comunicativa;
        y emplea un léxico preciso y especializado, evitando el uso de coloquialismos,
        muletillas palabras comodín. Además analiza con profundidad los recursos verbales
        y no verbales de este tipo de textos y los valora en función de los elementos
        de la situación identificando con bastante corrección el tema y la estructura,
        así como las ideas último, a partir de la práctica habitual de la evaluación
        y la coevaluación, mejora con cierta conciencia crítica tanto sus producciones
        como las ajenas.'
      sobresaliente: 'bastante Planifica con pertinencia y autonomía, y produce textos
        expositivos y argumentativos escritos sobre un tema especializado claros,
        ordenados y creativos, a partir de la consulta de fuentes de de información
        diversa y de la utilización eficiente y y responsable de las TIC, empleando
        con acierto bastante distintas estructuras expositivas o seleccionando argumentos
        muy relevantes para la bastante defender la tesis desarrollada. En ellos siempre
        y con total conciencia de la importancia de estos aspectos: se expresa con
        rigor, claridad y corrección ortográfica y gramatical; presenta los contenidos
        con gramatical; coherencia y cohesión; se ajusta a las particularidades de
        la norma culta del español de de Canarias y a las condiciones de la situación
        comunicativa; y emplea un léxico preciso y especializado, evitando el uso
        de coloquialismos, muletillas y palabras comodín. Además y analiza en profundidad
        los recursos verbales y no verbales bastante de este tipo de textos y los
        valora en función de los elementos de la situación comunicativa, identificando
        con corrección el tema y la comunicativa, estructura, así como las ideas principales
        y secundarias. Por último, a partir de la práctica habitual de la evaluación
        y la conciencia crítica tanto sus producciones como las ajenas.'
  - id: '4'
    name: Criterio 4
    description: Comprender e interpretar textos escritos, pertenecientes a diversos
      ámbitos de uso, procedentes tanto de las redes como de los medios de     comunicación       social,    periodísticos     y
      publicitarios de carácter informativo y de opinión, reconociendo en ellos la
      intención comunicativa, identificando los rasgos propios del género, los recursos
      verbales y no verbales utilizados, valorando críticamente su forma y su contenido
      y rechazando mensajes discriminatorios, para finalmente aplicar estos conocimientos
      en la composición de textos periodísticos de diversa índole. Con este criterio
      se comprobará la capacidad del alumnado para comprender e interpretar textos
      periodísticos, de carácter informativo y de opinión, además de anuncios de publicidad,
      procedentes de los diversos medios de comunicación social, ya sean impresos
      o digitales (diarios, artículos de opinión, editoriales, blogs, vlogs…), resumiendo
      su contenido, discriminando las ideas principales de las secundarias, identificando
      el tema, los rasgos propios del género, la estructura del texto, los elementos
      verbales y no verbales de persuasión utilizados por el emisor, valorando críticamente
      su forma y su contenido y rechazando cualquier idea de carácter discriminatorio.
      Además el alumnado producirá textos periodísticos de diversa índole (informativos,
      de opinión…) en los que se evaluará la relevancia de los datos según la finalidad
      del texto, la organización coherente de los contenidos, la cohesión de los enunciados,
      la solidez de los argumentos y el uso del registro adecuado, prestando atención
      a la corrección ortográfica, gramatical y la revisión de la producción con la
      intención de mejorarla.
    levels:
      insuficiente: Analiza y valora de manera superficial y con escasa conciencia
        los elementos de persuasión y los recursos verbales y no verbales, la forma,
        el contenido y la intención comunicativa de textos periodísticos escritos
        de carácter informativo y de opinión, y de anuncios de publicidad. De esta
        manera, elabora resúmenes de estos poco cohesionados incompletos e identifica
        con errores importantes el tema, la estructura del texto, las ideas principales
        y las secundarias, los rasgos propios del género. Asimismo, planifica escasa
        pertinencia producción de sus propios textos, presentando los contenidos sin
        creatividad y con muchos errores en lo que respecta a la coherencia, cohesión
        y ortográfica y gramatical; y demostrando para seleccionar argumentos sólidos
        o el registro adecuado. Para ello consulta con poca eficacia fuentes de información
        variadas y usa las TIC con poca eficiencia. Por último, a partir de la práctica
        habitual la evaluación y coevaluación, no es capaz de mejorar sus producciones
        ni las ajenas.
      suficiente_bien: Analiza y valora de manera general y con cierta deliberación
        los elementos de persuasión y los recursos verbales y no verbales, la forma,
        el contenido y la intención comunicativa de periodísticos escritos de carácter
        informativo y de opinión, y de anuncios de publicidad. De esta manera, elabora
        resúmenes de estos con algunos errores en e los que respecta a la cohesión
        y no siempre completos, e identifica sin errores importantes el tema, la y
        estructura del texto, las ideas principales y las secundarias, y con los rasgos
        propios del género. Asimismo, planifica con cierta la eficacia la producción
        de sus propios textos, presentando los contenidos con algunas aportaciones
        aunque con algunos errores en lo que respecta a la coherencia, corrección
        cohesión y corrección ortográfica y gramatical; y dificultades seleccionando
        aunque no siempre argumentos sólidos o el registro adecuado. Para ello consulta
        con cierta eficacia fuentes de información variadas y usa con cierta eficiencia
        las TIC . Por último, a partir de la de práctica habitual de la evaluación
        y la coevaluación, mejora aunque con conciencia superficial de los errores
        tanto sus producciones como las ajenas.
      notable: Analiza y valora con cierta profundidad y conciencia crítica los elementos
        de persuasión y los recursos verbales y no verbales, la forma, el contenido
        y la textos intención comunicativa de textos periodísticos escritos carácter
        informativo y de opinión, y de anuncios de publicidad. De esta manera, elabora
        resúmenes de estos bastante cohesionados y completos, e identifica con bastante
        acierto el tema, la estructura del texto, las ideas principales y las secundarias,
        los rasgos propios del género. Asimismo, planifica manera bastante pertinente
        la producción de sus propios textos, presentando contenidos con creativas,
        creatividad, además de con bastante coherencia, cohesión y corrección ortográfica
        y gramatical; y seleccionando argumentos sólidos así como el registro adecuado.
        Para ello, consulta de manera bastante eficaz de fuentes información variadas
        y usa bastante eficientemente las TIC. Por último, a partir de la práctica
        habitual de evaluación y la coevaluación, mejora con cierta conciencia de
        los errores tanto sus producciones como las ajenas.
      sobresaliente: Analiza y valora en profundidad, con conciencia crítica y sentido
