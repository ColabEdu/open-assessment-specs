      notable: 'Manifiesta una visión global de las variedades geográficas, sociales
        y funcionales de la lengua española: demuestra que conoce de manera bastante
        precisa el origen y la evolución de las lenguas de España y de las variedades
        del español; describe con fluidez sus características y principales rasgos
        diferenciales; y explica con coherencia características de diferentes registros
