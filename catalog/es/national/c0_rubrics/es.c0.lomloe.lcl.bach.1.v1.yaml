        valorando con acierto y sentido estético los recursos expresivos empleados
        por el emisor de un texto, y diferenciando y explicando las marcas de objetividad
        y de subjetividad y los distintos procedimientos gramaticales de inclusión
        del emisor en el mensaje. Para todo ello utiliza con bastante destreza fuentes
        de consulta impresas o digitales.
      sobresaliente: Reconoce y explica, con profundidad, sistematicidad y conciencia
        crítica, los rasgos estructurales y lingüísticos de las diferentes tipologías
        COMPETENCIA MATEMÁTICA Y CC.BB. EN CIENCIA Y TECNOLOGÍA textuales en los planos
        morfosintáctico, léxico- SENTIDO DE INICIATIVA Y semántico y pragmático- textual.
        Asimismo, aplica de estos manera eficaz y pertinente COMPETENCIAS SOCIALES
        Y CÍVICAS la estos conocimientos en la interpretación y producción de COMPETENCIA
        LINGÜÍSTICA textos orales y escritos, APRENDER A APRENDER COMPETENCIA DIGITAL
        sus incorporando a sus producciones los distintos procedimientos de cohesión
        con textual, analizando con precisión las formas gramaticales deícticas que
        hacen referencia al contexto a temporal y espacial, así como a la los participantes
        en la comunicación, valorando con gran acierto y sentido estético los recursos
        expresivos empleados por el emisor de un texto, y diferenciando y explicando
        las marcas de objetividad y de subjetividad y los distintos procedimientos
        gramaticales de inclusión del emisor en el mensaje. Para todo ello utiliza
        con destreza fuentes de consulta impresas o digitales.
  - id: '8'
    name: Criterio 8
    description: Explicar, a partir de textos orales y escritos, una visión global
      de las variedades geográficas, sociales y funcionales de la lengua española,
      mediante el conocimiento de los orígenes y la evolución histórica de las lenguas
      y variedades del español, y de la descripción de sus principales características
      y rasgos diferenciales; y a través del reconocimiento y la explicación de los
      diversos usos sociales y funcionales de la lengua, valorando esta diversidad
      como muestra de nuestro patrimonio cultural y mostrando interés por ampliar
      su propio repertorio verbal y evitar los prejuicios y estereotipos lingüísticos.
      Reconocer y valorar, en el uso comunicativo, la norma culta del español hablado
      en Canarias, a partir del conocimiento razonado de sus características fónicas,
      gramaticales y léxicas, a fin de mejorar su uso comunicativo. Con este criterio
      se constatará si el alumnado es capaz de reconocer, a través de la audición
      o lectura de muestras reales, procedentes de diversas fuentes y ámbitos (familiar,
      social, académico…), diferentes registros de habla (formal, informal, familiar…),
      de explicar sus características y de seleccionar, en sus propias producciones,
      orales y escritas, el léxico y las expresiones adecuadas en contextos comunicativos
      que exigen un uso formal de la lengua, evitando el uso de coloquialismos, imprecisiones
      o expresiones clichés. Asimismo, se comprobará si sabe distinguir razonadamente,
      en distintos ejemplos de discurso, las características que corresponden a una
      diferencia de registro o de variedad social, explicando la influencia del medio
      social en el uso de la lengua e identificando y rechazando los estereotipos
      lingüísticos que suponen una valoración peyorativa hacia los usuarios y las
      usuarias de la lengua, o hacia cualquier variedad geográfica del español. Se
      verificará que demuestra un conocimiento del origen y la evolución de las lenguas
      de España y de las variedades del español, a fin de mejorar la adecuación de
      los discursos propios a cada situación comunicativa, prescindir de ideas preconcebidas
      en torno a la distribución dialectal del idioma, así como valorar la norma culta
      canaria como variedad      de    prestigio,    evitando      alternancias, incorrecciones
      e inseguridades en su uso formal.
    levels:
