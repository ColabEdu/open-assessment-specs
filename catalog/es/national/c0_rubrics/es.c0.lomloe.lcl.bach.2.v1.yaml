      sobresaliente: Planifica y realiza, de forma muy pertinente y con un de adecuado
        y detallado desarrollo trabajos de investigación en los que respeta las normas
        establecidas para la presentación de este tipo de producciones. De esta manera,
        de manera totalmente autónoma y con iniciativa propia, fija sus propios objetivos;
        organiza la información en función de un orden predefinido; contrasta posturas
        enfrentadas, llegando a conclusiones personales y exponiéndolas con distintos
