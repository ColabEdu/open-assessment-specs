  - id: '7'
    name: Criterio 7
    description: Interpretar y describir el significado de las palabras en su contexto
      comunicativo, a través del reconocimiento y explicación de los procesos de creación
      del léxico en español y de la identificación y explicación de los distintos
      niveles de significado de las palabras o expresiones en función de la intención
      comunicativa del discurso oral o escrito en el que aparecen, con la debida atención
      al léxico específico del español de Canarias y a la elección de un vocabulario
      adecuado y respetuoso con la diferencia de sexos y la igualdad de derechos y
      deberes entre las personas, utilizando el apoyo de diccionarios y otras fuentes
      de consulta en formato papel y digital, todo ello con el fin de enriquecer el
      vocabulario activo y mejorar la comunicación. Con este criterio se persigue
      constatar si los alumnos y las alumnas muestran, en diversidad de situaciones
      comunicativas orales y escritas, una mejora en la comprensión del significado
      de las palabras y expresiones, así como un enriquecimiento de su vocabulario
      activo en sus producciones. Para ello, se verificará si son capaces de explicar
      y aplicar, en textos cotidianos de ámbito académico o social, los procedimientos
      de formación de las palabras diferenciando entre raíz y afijos y explicando
      su significado y procedencia de prefijos y sufijos, con especial atención a
      aquellos de origen griego y latino, para ayudarse en la deducción del significado
      de palabras desconocidas, reconocer las posibilidades de la creación léxica
      y la evolución etimológica del vocabulario de la lengua castellana. Asimismo,
      se constatará si explican con propiedad el significado de palabras o expresiones,
      diferenciando su uso denotativo y connotativo y relacionándolo con la intención
      comunicativa del emisor y también reconocen, analizan e interpretan las relaciones
      semánticas entre las palabras (sinonimia, antonimia, hiperonimia, polisemia
      y homonimia) como procedimientos de cohesión textual, aplicando estos conocimientos
      a la mejora de sus mensajes orales y terminología adecuados en contextos comunicativos
      que exigen un uso formal y especializado de la lengua, evitando el uso de coloquialismos,
      imprecisiones o expresiones clichés, y procurando la debida atención al léxico
      específico del español de Canarias y a la elección de un vocabulario adecuado
      y respetuoso con la diferencia de sexos y la igualdad de derechos y       y
      deberes.
    levels:
      insuficiente: Explica con imprecisión y dificultad, los procedimientos de formación
        de las palabras y el significado y procedencia de prefijos y sufijos. De esta
        manera, rara vez define con propiedad, incluso en previsibles, el significado
        de palabras o diferenciando su denotativo y connotativo, y relacionándolo
        con la intención comunicativa del emisor; muestra dificultades para deducir
        el significado de palabras demostrando por tanto que no conoce suficientemente
        la evolución etimológica del vocabulario de la lengua castellana. Asimismo,
        solo es capaz de analizar relaciones semánticas entre las palabras como procedimientos
        de cohesión textual cuando estas son muy evidentes. Aplica estos conocimientos
        con poco interés y conciencia superficial para enriquecer su vocabulario activo
        y para seleccionar el léxico y la terminología adecuados en contextos comunicativos
        que exigen un uso formal y especializado de la lengua, así como para mejorar
        tanto la comprensión como la propia producción de textos orales y escritas,
        de modo que incurre en el uso de coloquialismos, clichés. Además, en relación
        al uso del léxico específico del español de Canarias, así como de un vocabulario
        adecuado y respetuoso con la diferencia de sexos y la igualdad de derechos
        deberes entre las personas, no siempre resulta correcto y pertinente.
      suficiente_bien: cierta Explica sin dificultad destacable pero de forma poco
        precisa los procedimientos de formación de las palabras y el significado y
        procedencia de prefijos y sufijos. De esta manera, contextos siempre que el
        contexto sea previsible, define con expresiones, propiedad el significado
        de uso palabras o expresiones, diferenciando su uso denotativo y connotativo,
        y relacionándolo con la intención comunicativa del emisor; y casi siempre
        deduce el desconocidas, significado de palabras desconocidas, demostrando
        que conoce suficientemente la evolución etimológica del vocabulario de la
        lengua castellana. Asimismo, analiza, las aunque solo a partir de modelos
        similares, relaciones semánticas entre las palabras como procedimientos de
        cohesión textual. Aplica estos conocimientos con cierto interés y deliberación
        para enriquecer su vocabulario activo y para seleccionar el léxico y la terminología
        adecuados en contextos comunicativos que exigen un uso formal y especializado
        de la lengua, así como para mejorar tanto la comprensión como la propia producción
        de textos orales y escritas, evitando casi siempre el uso de coloquialismos,
        clichés. Además, utiliza, generalmente por propia iniciativa pero no siempre
        de forma correcta y pertinente , léxico específico del español de Canarias,
        así como un vocabulario adecuado y respetuoso con la diferencia de sexos y
        la igualdad de derechos y deberes entre las personas.
      notable: Explica con precisión y fluidez los procedimientos de formación de
        las palabras y el significado y procedencia de prefijos y sufijos. De esta
        manera, en la mayor parte de los contextos, define con propiedad el significado
        de palabras o diferenciando su denotativo y connotativo, y relacionándolo
        con la intención comunicativa del emisor; y deduce el significado de palabras
        demostrando que convenientemente evolución etimológica del vocabulario de
        la lengua castellana. Asimismo, analiza con agudeza las relaciones semánticas
        entre las palabras como procedimientos las cohesión textual. Aplica estos
        conocimientos con bastante interés y deliberación para enriquecer su vocabulario
        activo y para seleccionar el léxico y la terminología adecuados en comunicativos
        que exigen un uso formal y especializado de la lengua, así como para mejorar
        tanto la comprensión como la propia producción de textos orales y escritas,
        evitando siempre el uso de coloquialismos, imprecisiones o expresiones clichés.
        Además, utiliza por propia iniciativa con corrección y pertinencia de Canarias,
        así como un vocabulario adecuado y respetuoso con la diferencia de sexos y
        la igualdad de derechos y deberes entre las personas.
      sobresaliente: Explica con total precisión y fluidez destacable los procedimientos
        de formación de las palabras y el significado y procedencia de prefijos y
        sufijos. De esta manera, en cualquier contexto, define con propiedad el significado
        de expresiones, palabras o expresiones, uso diferenciando su uso denotativo
        y connotativo, y relacionándolo con la intención comunicativa del emisor;
        y deduce el significado de desconocidas, palabras desconocidas, conoce demostrando
        que conoce la destacadamente la evolución etimológica del vocabulario de la
        lengua castellana. Asimismo, analiza con sistematicidad las relaciones semánticas
        entre las palabras como procedimientos de de cohesión textual. Aplica estos
        conocimientos con interés y conciencia crítica para enriquecer su vocabulario
        activo y para seleccionar el léxico y la terminología adecuados en contextos
        contextos comunicativos que exigen un uso formal y especializado de la lengua,
        así como para mejorar tanto la comprensión como la propia producción de textos
        orales y escritas, evitando siempre el uso de coloquialismos, imprecisiones
        o expresiones clichés. Además, utiliza por propia iniciativa y y con corrección,
        pertinencia y asertividad léxico específico como un vocabulario adecuado y
        respetuoso con la diferencia de sexos y la igualdad de derechos y deberes
        entre las personas.
  - id: '8'
    name: Criterio 8
    description: Explicar, a partir de textos orales y escritos, una visión global
      de la situación del español en el mundo, a partir del conocimiento de sus orígenes
      y evolución histórica, incluyendo la situación del español en el ámbito digital,
      y de la descripción de sus    principales     características    y     rasgos
      diferenciales, con la finalidad de comprender y valorar esta presencia y sus
      variantes en el español de América como riqueza patrimonial y cultural. Reconocer
      y valorar, en el uso comunicativo, la norma culta del español hablado en Canarias,
      a partir del conocimiento razonado de sus características fónicas, gramaticales
      y léxicas, comparando y apreciando los lazos lingüísticos y culturales     existentes    entre     Canarias      e
      Hispanoamérica. Con este criterio se constatará si el alumnado describe la situación
      actual de la lengua española en el mundo, diferenciando los usos específicos
      de la lengua en la red digital, y mostrando un conocimiento de los orígenes
      históricos del español en América y sus principales áreas geográficas, reconociendo
      en ejemplos orales o escritos algunos de sus rasgos característicos y valorando
      positivamente sus variantes, a fin de prescindir de ideas preconcebidas en torno
      a la distribución dialectal del idioma y valorar la norma culta canaria como
      variedad de prestigio, inserta en el mismo proceso histórico y cultural, evitando
      así alternancias, incorrecciones e inseguridades en su uso formal.
    levels:
      insuficiente: Comete incorrecciones y muestra escasa fluidez en descripción
        de las principales características y los rasgos diferenciales del español,
        así como los orígenes y la evolución histórica de esta lengua en el mundo,
        su situación actual y los usos específicos de la lengua en la red digital.
        Asimismo, reconoce con algunos de los característicos de variedades del español
        de América y sus principales áreas geográficas, incoherencias en explicación
        de sus lazos lingüísticos, históricos culturales con el español hablado en
        Canarias. Incurre en errores en reconocimiento de características gramaticales
        y léxicas del español hablado en Canarias, y demuestra así ingenuidad en la
        la valoración de la norma culta canaria como variedad de prestigio, de manera
        que comete con cierta frecuencia errores de alternancia, y otras incorrecciones
        e inseguridades en su uso formal.
      suficiente_bien: algunas Describe sin incorrecciones importantes y con bastante
        la fluidez las principales características y los rasgos diferenciales del
        español, así como los orígenes y la evolución histórica de esta lengua en
        el mundo, su situación actual y los usos específicos de la lengua en la red
        digital. Asimismo, reconoce algunos de los rasgos dificultad característicos
        de las rasgos variedades del español de las América y sus principales áreas
        geográficas, explicando con bastante coherencia además mostrando sus lazos
        lingüísticos, la históricos y culturales con el español hablado en Canarias.
        y Reconoce sin imprecisiones importantes las características fónicas, gramaticales
        y léxicas el del español hablado en las Canarias, valorando con cierta fónicas,
        conciencia la norma culta canaria como variedad de prestigio, de manera que
        normalmente evita alternancias, incorrecciones e inseguridades en su uso formal.
      notable: Describe con corrección y fluidez las características y los rasgos
        diferenciales del español, así como los orígenes y la evolución histórica
        de esta lengua en el mundo, su situación actual y los usos específicos de
        la lengua en la red digital. reconoce algunos de los rasgos característicos
        de variedades del español de América y sus principales áreas geográficas,
        explicando con coherencia además sus lazos lingüísticos, históricos culturales
        con el español hablado en Canarias. Reconoce con bastante precisión las características
        gramaticales y léxicas del español hablado en Canarias, valorando con deliberación
        la norma culta canaria como variedad de prestigio, de manera que evita casi
        siempre alternancias, incorrecciones e inseguridades en su uso formal.
      sobresaliente: Describe con corrección y principales fluidez destacables las
        principales características y los rasgos diferenciales del español, así como
        los orígenes y la evolución histórica de esta lengua en el mundo, su situación
        actual y los usos específicos de la lengua en la Asimismo, red digital. Asimismo,
        reconoce algunos de los rasgos las característicos de las variedades del español
        de América y sus principales áreas geográficas, explicando con propiedad además
        sus lazos y lingüísticos, históricos y culturales con el español hablado en
        Canarias. Reconoce de forma precisa las fónicas, características fónicas,
        gramaticales y léxicas del español hablado en Canarias, valorando con conciencia
        crítica la norma culta canaria como variedad de prestigio, de manera que evita
        siempre alternancias, incorrecciones e inseguridades en su uso formal.
  - id: '9'
    name: Criterio 9
    description: Leer, analizar e interpretar críticamente fragmentos u obras completas
      de la literatura española, incluida la canaria, representativas de los principales
      movimientos literarios del siglo XX hasta nuestros días, con la adecuada atención
      a las muestras creadas por escritoras representativas de las distintas épocas,
      reconociendo e interpretando sus características temáticas y formales, relacionándolas
      con el contexto histórico, social, artístico y cultural, con el movimiento y
      el género literario al que pertenece, además de con la trayectoria y estilo
      del autor o la autora, constatando asimismo la evolución histórica de los temas
      y las formas. Con este criterio se pretende evaluar la capacidad del alumnado
      para analizar e interpretar críticamente obras literarias significativas de
      la literatura española del siglo XX hasta la actualidad, con la debida atención
      a las muestras creadas por escritoras representativas de las distintas épocas
      y a los autores y a las autoras canarios, en su contexto histórico, social,
      artístico y cultural, relacionando el contenido y las formas de expresión con
      la trayectoria y el estilo de su autor o autora, su género y el movimiento literario
      al que pertenece, comparándolas a su vez con otras obras de la época o de épocas
      diferentes que presenten algún vínculo con ellas, constatando la presencia de
      determinados temas y formas, y la evolución en la manera de tratarlos. Para
      ello el alumnado, participará en situaciones comunicativas, propias del ámbito
      académico, personal y social (debates, mesas redondas…) que favorezcan el intercambio
      de opiniones y perspectivas para retroalimentar las propias, y realizará trabajos
      personales, por escrito, de interpretación y valoración, con coherencia y corrección,
      propios del ámbito académico y social (comentarios de texto, estudios comparativos…).
      Todo ello con la intención de que el alumnado, realice el estudio cronológico
      de las obras seleccionadas, además de desarrollar y fortalecer su espíritu crítico
      y su personalidad literaria
    levels:
      insuficiente: Analiza y valora críticamente con claras imprecisiones y ciertas
        destacables obras literarias representativas de la literatura española del
        siglo XX hasta la actualidad, de manera que casi no las relaciona con el contexto
        histórico, social, artístico y cultural en el que surgen; con el movimiento
        y género al que pertenecen; y con la trayectoria y el estilo de su autor o
        autora. Además, de inadecuada compara estas obras con otras de la misma época
        o de otras diferentes, con las que presenten algún vínculo y sin constatar
        la presencia de determinados temas y formas, así como la evolución de los
        mismos. Para ello, participa de manera muy poco activa y con conciencia superficial
        en situaciones comunicativas que favorecen la emisión de juicios básicos y
        el intercambio de opiniones, y elabora trabajos de diversa índole con dificultades
        en lo que a coherencia y corrección se generalmente inacabados o con imperfecciones
        notables.
      suficiente_bien: Analiza y valora críticamente sin imprecisiones dificultades
        importantes y sin grandes dificultades obras literarias representativas de
        la literatura española del siglo XX hasta la actualidad, de manera que las
        relaciona con el contexto histórico, social, artístico y cultural en el que
        surgen; con el movimiento y género al que pertenecen; y con la trayectoria
        y el estilo de su autor o autora. forma Además, de forma aceptable compara
        estas obras con otras de la misma época o de otras diferentes, con las que
        presenten algún vínculo y constata la presencia de determinados temas y formas,
        así como la evolución de los mismos. Para ello, participa con cierta deliberación
        aunque no siempre de manera activa en situaciones comunicativas que favorecen
        la emisión de juicios sencillos y el intercambio de opiniones., y elabora
        trabajos de diversa índole sin dificultades refiere, importantes en lo que
        a coherencia y corrección se refiere, presentando un desarrollo y un acabado
        aceptable.
      notable: Analiza y valora críticamente con bastante precisión y fluidez obras
        representativas de la literatura española del siglo XX hasta la actualidad,
        de manera que las relaciona con el contexto histórico, social, artístico y
        cultural en el que surgen; con el movimiento y género al que pertenecen; y
        con la trayectoria y el estilo de su autor o autora. Además, de manera bastante
        pertinente compara estas obras con otras de la misma época o de otras diferentes,
        con las que presenten algún vínculo y constata la presencia de determinados
        temas y formas, así como la evolución de los mismos. Para ello, participa
        de forma bastante activa y con deliberación en situaciones comunicativas que
        favorecen la emisión de juicios de cierta complejidad y el intercambio de
        opiniones, y elabora trabajos de diversa índole coherencia y corrección, que
        presentan un desarrollo y un cavado adecuado.
      sobresaliente: Analiza en profundidad y con precisión y valora críticamente
        literarias textos representativas de la literatura española del siglo XX hasta
        la actualidad, de manera que las relaciona con el contexto histórico, social,
        artístico y cultural en el que surgen; con el movimiento y género al que pertenecen;
        y con la trayectoria y el estilo de su autor o autora. Además, de manera pertinente
        y autónoma, compara estas obras con otras de la misma época o de otras diferentes,
        con las que presenten algún vínculo y constata la presencia de determinados
        temas y formas, así como la evolución de los mismos. Para ello, participa
        de forma activa y con conciencia crítica en situaciones comunicativas que
        favorecen la emisión de juicios complejos y el intercambio de opiniones, y
        elabora trabajos de diversa con índole con coherencia y corrección, que presentan
        un desarrollo y un acabado destacable.
  - id: '10'
    name: Criterio 10
    description: Elaborar textos escritos, de diversa índole, en formato papel o digital,
      vinculados a un tema, a una obra, o a un autor o una autora de la literatura
      del siglo XX hasta nuestros días, a partir de la consulta de fuentes diversas,
      adoptando un punto de vista crítico, en los que además deberán plasmar los conocimientos
      literarios y artísticos adquiridos a partir de su experiencia lectora, cultural
      y personal. Con este criterio se pretende comprobar la capacidad del alumnado
      para elaborar textos escritos de diversa índole (trabajos y presentaciones académicas,
      desarrollo de un tema, textos literarios…) presentados en soporte papel o digital,
      vinculados a un tema, una obra o un autor o una autora de la literatura del
      siglo XX hasta nuestros días, consultando fuentes diversas y adoptando un punto
      de vista crítico y personal, utilizando con solvencia y responsabilidad las
      tecnologías de la información y la comunicación, extrayendo la información relevante
      para ampliar conocimientos sobre el tema, exponiendo las ideas con rigor, claridad,
      coherencia y corrección y aplicando los conocimientos literarios y artísticos
      adquiridos, en los que no solo se refleje su experiencia lectora, su bagaje
      cultural y personal, sino también la vinculación de la literatura con el resto
      de las manifestaciones artísticas, poniendo de manifiesto la importancia de
      la lectura y la escritura como fuente de conocimiento y de placer, como forma
      de creación y de comunicación de ideas y de emociones.
    levels:
      insuficiente: Elabora textos escritos básicos de diversa índole, vinculados
        a un tema, a obras o a autores o autoras de la literatura del siglo XX hasta
        la actualidad, en los que rara vez adopta un punto de vista personal y crítico,
        utilizando con solvencia y con responsabilidad las TIC y consultando apenas
        fuentes diversas. De esta manera, extrae con imprecisiones la información
        relevante y expone las ideas sin rigor, con escasa claridad y incorrecciones
        importantes en lo que a coherencia y corrección se refiere. Además, ocasionalmente
        aplica los conocimientos literarios y artísticos adquiridos, y no refleja
        en sus producciones su experiencia lectora y su bagaje cultural y personal.
      suficiente_bien: Elabora textos escritos sencillos de diversa índole, vinculados
        a un tema, a obras o a autores o autoras de la literatura del siglo XX hasta
        la actualidad, en los frecuentemente adopta un escasa punto de vista personal
        y poca crítico, utilizando con cierta solvencia y responsabilidad las TIC
        y consultando como usuario básico fuentes diversas. De esta manera, extrae
        de forma aceptable la información relevante y expone cometiendo las ideas
        con cierto rigor y claridad cometiendo incorrecciones en lo que a coherencia
        y corrección se refiere. Además, aplica de forma aceptable y con algunas aportaciones
        creativas los conocimientos literarios y adquiridos, reflejando en sus producciones
        su experiencia lectora y su bagaje cultural y personal.
      notable: Elabora textos escritos de cierta complejidad de diversa índole, vinculados
        a un tema, obras o a autores o autoras de la literatura del siglo XX hasta
        que la actualidad, en los que regularmente adopta un punto de vista personal
        y crítico, utilizando con solvencia y responsabilidad las TIC y consultando
        de forma eficaz fuentes diversas. De esta manera, extrae la información relevante
        y expone las ideas con cierto rigor y destacable claridad, coherencia corrección.
        Además, bastante precisión y cierta creatividad, aplica conocimientos literarios
        y artísticos adquiridos, reflejando en sus producciones su experiencia lectora
        y su bagaje artísticos cultural y personal.
      sobresaliente: Elabora textos escritos complejos de diversa índole, a vinculados
        a un tema, a obras o a autores o autoras de la literatura del siglo XX hasta
        la actualidad, en los que siempre adopta un punto de vista personal y crítico,
        utilizando bastante con destacable solvencia y responsabilidad las TIC y consultando
        con versatilidad fuentes diversas. De esta manera, extrae la información relevante
        y expone las ideas con rigor, notable claridad y y con total coherencia y
        con corrección. Además, con precisión y creatividad aplica los los conocimientos
        literarios y artísticos adquiridos, reflejando en sus producciones su experiencia
        lectora y su bagaje cultural y personal.
