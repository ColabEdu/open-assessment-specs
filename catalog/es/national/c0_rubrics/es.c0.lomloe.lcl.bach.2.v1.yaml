  - id: '6'
    name: Criterio 6
    description: Aplicar sistemáticamente los conocimientos ortográficos, gramaticales
      y lingüísticos, con la debida atención a las particularidades del español de
      Canarias, en la realización, autoevaluación y mejora de textos orales y escritos
      propios del ámbito personal, académico y social, con ayuda de un uso autónomo
      del diccionario y otras fuentes de información digitales o impresas, y poniendo
      en práctica distintas estrategias que permitan la mejora de la comunicación
      oral y escrita, de manera que el alumnado pueda identificar y explicar, en contextos
      comunicativos diversos, los rasgos característicos, usos y valores de todas
      las categorías gramaticales en contexto, así como observar, reflexionar y explicar
      las distintas estructuras sintácticas de un texto, señalando las conexiones
      lógicas y semánticas que se establecen entre ellas, y utilizándolas en sus propias
      producciones, todo ello en relación con la intención y la situación comunicativa,
      a fin de tomar conciencia de la importancia del conocimiento gramatical para
      el uso correcto de la lengua, mejorar y enriquecer su vocabulario activo y avanzar
      en su aprendizaje autónomo. Comprender y valorar las normas de uso lingüístico
      en torno a la expresión del género, para fomentar un uso comunicativo de la
      lengua que, de acuerdo a sus normas gramaticales, sea respetuoso con la diferencia
      de sexos y la igualdad de derechos y deberes entre las personas. Este criterio
      pretende comprobar si el alumnado aplica, en la realización, autoevaluación
      y mejora de textos orales y escritos propios del ámbito personal, académico
      o social, ayudándose de un uso adecuado de diccionarios y fuentes de información
      en formato papel o digital, y empleando la terminología gramatical adecuada,
      conocimientos y normas de uso de la lengua para mejorar la adecuación, coherencia
      y cohesión de las producciones propias y ajenas, siempre en relación con la
      intención comunicativa del emisor, la tipología textual, y otros componentes
      de la identifica y explica los usos y valores en la comunicación todas las categorías
      gramaticales en un texto      (incluidos     adverbios,     conjunciones, preposiciones
      e interjecciones), que reconoce e incorpora en sus propias producciones variadas
      estructuras sintácticas (simples y complejas), explicando la relación funcional
      y de significado que establecen con el verbo de la oración principal y con otros
      elementos del texto, y valorando la importancia del conocimiento y la corrección
      gramatical (con la adecuada atención a los aspectos relacionados con la expresión
      de las diferencias de género y el fomento de un lenguaje coeducativo) para la
      mejora en el uso de la lengua y su competencia en comunicación lingüística.
    levels:
      insuficiente: Aplica frecuentemente aunque con superficial sobre importancia
        de hacerlo sus conocimientos morfológicos y sintácticos al enriquecimiento
        de textos orales o escritos, propios o ajenos, y a la mejora de la adecuación,
        la coherencia y la cohesión de estos, teniendo en cuenta la intención comunicativa
        del emisor, la tipología textual y otros componentes de la situación comunicativa,
        y empleando de manera poco adecuada diccionarios y otras fuentes de consulta.
        De esta manera, de forma pautada, identifica y explica, utilizando terminología
        adecuada y demostrando un conocimiento insuficiente de los usos y valores
        de todas las categorías gramaticales, así como las funcionales y de significado
