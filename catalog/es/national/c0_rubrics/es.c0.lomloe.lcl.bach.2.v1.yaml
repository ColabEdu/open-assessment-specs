  - id: '3'
    name: Criterio 3
    description: Producir textos escritos expositivos y argumentativos en contextos
      formales de aprendizaje con rigor, claridad y corrección ortográfica y gramatical,
      a partir de un esquema previo que contemple la planificación, realización, revisión
      y mejora del texto, empleando distintas estructuras expositivas (comparación,
      problema- solución,      enumeración,     causa-consecuencia, ordenación cronológica…)
      o exponiendo, en su caso, las diversas opiniones que se sostienen, adoptando
      una posición crítica bien argumentada y convincente y ajustando su expresión
      a la intención comunicativa y al resto de las condiciones de la situación comunicativa,
      con el apoyo de las Tecnologías de la Información y la Comunicación, valorando
      la escritura como un medio de expresión de emociones y sentimientos y de desarrollo
      del espíritu crítico. Este criterio nos va a permitir evaluar que el alumnado
      planifica y produce textos escritos sobre un tema especializado con rigor, claridad
      y corrección ortográfica y gramatical, aplicando los conocimientos gramaticales
      y pragmáticos para mejorar la expresión escrita, ajustando su expresión a las
      condiciones de la situación comunicativa (tema, ámbito discursivo, tipo de destinatario,
      género textual…), empleando los recursos expresivos propios del registro formal
      y evitando el uso de coloquialismos. Se valorará igualmente la coherencia y
      cohesión en la presentación de los contenidos o la relevancia de los argumentos
      seleccionados en función de la tesis desarrollada, cuando proceda. Por último,
      evalúa sus propias producciones escritas y las de sus compañeros,       reconociendo       las     dificultades
      estructurales y expresivas, recurriendo a obras de consulta tanto impresas como
      digitales para su corrección y diseñando estrategias para mejorar su redacción
      y avanzar en el aprendizaje autónomo. con muchas imprecisiones el          principales
      y secundarias. tema y la estructura, así como       último, a partir de la las    ideas     principales     y   habitual
