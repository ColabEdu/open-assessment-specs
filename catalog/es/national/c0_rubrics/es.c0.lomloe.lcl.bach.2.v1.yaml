        evaluación y la coevaluación, mejora con bastante profundidad y cierto sentido
        crítico tanto sus producciones como las ajenas.'
      sobresaliente: 'Planifica y produce con y pertinencia y autonomía orales textos
        orales expositivos y argumentativos sobre un tema polémico en los que analiza
        en profundidad posturas posturas enfrentadas, defendiendo una opinión propia
        mediante mediante argumentos sólidos y muy bastante convincentes. En estas
        estas producciones siempre y con total conciencia de la importancia de estos
        aspectos: se expresa con claridad, precisión y corrección; respeta las características
        gramaticales y la ortofonía de la norma culta del español de Canarias; adapta
        los elementos verbales y no verbales a las condiciones de la situación comunicativa;
        y emplea un léxico preciso y especializado, así como los recursos expresivos
        propios del registro formal. Para todo ello, con destreza y acierto: consulta
        fuentes de información diversa, utiliza apoyos audiovisuales o o gráficos,
        y sigue un guion previamente establecido para estructurar la información obtenida,
        aplicando aplicando correctamente los los procedimientos de cita. cita. Además,
        demuestra que que comprende este tipo de textos, de manera que elabora resúmenes
        de estos con precisión: discrimina la relevante, reconoce las distintas formas
        de organización del discurso y analiza los recursos verbales y no verbales
        empleados por el valorándolos en función de los elementos de la situación
        comunicativa. Por último, a partir de la práctica habitual de la evaluación
        y la coevaluación, mejora con gran profundidad y sentido crítico tanto sus
        producciones como las ajenas.'
  - id: '2'
    name: Criterio 2
    description: Comprender y producir textos orales periodísticos y publicitarios
      procedentes de los medios y redes de comunicación social, reconociendo la intención
      comunicativa, el tema y la estructura del contenido; identificando los rasgos
      propios del género periodístico, los recursos verbales y no verbales utilizados
      y valorando de forma crítica su forma y su contenido; así como relacionando
      los aspectos formales del texto con la intención comunicativa del emisor y con
      el resto de los factores de la situación comunicativa para valorar la importancia
      de la escucha activa como un medio de adquisición de conocimientos. Con este
      criterio se pretende evaluar la capacidad del alumnado para comprender, producir
      y evaluar textos orales procedentes de los medios y redes de comunicación       social   (informativos,     tertulias
      radiofónicas, reportajes, publicidad audiovisual, blogs…). De esta manera, demostrará
      que reconoce las distintas formas de organización del contenido en una argumentación
      oral, analizando los recursos verbales y no verbales empleados por el emisor
      y valorándolos en función de los elementos de la situación comunicativa; e interpreta
      diversos anuncios sonoros y audiovisuales identificando la información y la
      persuasión, reconociendo los elementos que utiliza el emisor para seducir al
      receptor, valorando críticamente su forma y su contenido y rechazando las ideas
      discriminatorias. Asimismo, en sus propias producciones, defiende una opinión
      propia mediante argumentos razonados, consultando fuentes de información diversa
      para recopilar información y apoyos audiovisuales o gráficos y siguiendo un
      guión previamente establecido para estructurar la información obtenida, utilizando
      correctamente los procedimientos de cita. Además, se expresa con claridad, precisión
      y corrección, adaptando su actuación verbal y no verbal (entonación, tono, timbre
      velocidad, gestos…) a las condiciones de la situación comunicativa (tema, ámbito
      discursivo, tipo de sus producciones y las de sus compañeros, detectando las
      dificultades estructurales y expresivas y diseñando   diversas, estrategias
      para mejorar sus prácticas orales y           incorrectamente progresar en el
      aprendizaje autónomo.
