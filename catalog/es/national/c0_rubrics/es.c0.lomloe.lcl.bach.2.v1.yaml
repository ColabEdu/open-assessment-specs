  criteria:
  - id: '1'
    name: Criterio 1
    description: Producir textos expositivos y argumentativos orales no espontáneos
      en contextos de aprendizaje formal (académicos, profesionales y empresariales)
      sobre un tema controvertido, contraponiendo puntos de vista enfrentados, defendiendo
      una opinión personal con argumentos convincentes que le permita afianzar la
      confianza en uno mismo y el sentido crítico, y siguiendo un proceso de planificación,
      documentación, evaluación y mejora con el apoyo de las Tecnologías de la Información
      y la Comunicación; así como sintetizar el contenido de este tipo de textos,
      entendiendo la importancia de la escucha activa como un medio de adquisición
      de conocimientos y como vehículo que le permita participar de forma responsable
      y asertiva en cualquier tipo de interacción social. Con este criterio se pretende
      evaluar la capacidad del alumnado para planificar, producir y evaluar producciones
      orales expositivas y argumentativas de forma individual o en grupo, en contextos
      académicos (entrevistas culturales, disertaciones científicas…), profesionales
      (conferencias, mesas redondas …) y empresariales (charlas, videoconferencias
      …) sobre un tema polémico, analizando posturas enfrentadas y defendiendo una
      opinión propia mediante argumentos convincentes. Para ello,        consulta
      fuentes de información diversa para recopilar información y apoyos audiovisuales
      o gráficos y sigue un guión previamente establecido para estructurar la información
      obtenida, utilizando correctamente los procedimientos de cita. Además, se expresa
      con claridad, precisión y corrección, adaptando su actuación verbal y no verbal
      (entonación, tono, timbre velocidad, gestos…) a las condiciones de la situación
      comunicativa (tema, ámbito discursivo, tipo de destinatario…), empleando los
      recursos expresivos propios     del     registro    formal.     Asimismo comprobaremos
      que el alumnado desarrolla la escucha resumir por escrito este tipo de textos.
      Por último, el alumno o alumna evalúa sus producciones y las de sus compañeros,
      detectando las dificultades estructurales y expresivas y diseñando estrategias
      para mejorar sus prácticas orales y progresar en el aprendizaje autónomo.
    levels:
      insuficiente: 'Planifica y produce con poca pertinencia y autonomía textos orales
        expositivos y argumentativos sobre un tema polémico, en los que analiza de
        manera superficial posturas enfrentadas, dificultades para defender una opinión
        propia argumentos convincentes. En estas producciones rara vez y sin ser consciente
        de la importancia de estos aspectos: se expresa con claridad, precisión y
        corrección; respeta las características gramaticales y la ortofonía de la
        norma culta del español de Canarias; adapta los elementos verbales y no verbales
        a las condiciones de la situación comunicativa; y emplea un léxico preciso
        y especializado, así como los recursos expresivos propios del registro formal.
        Para ello, consulta con poca destreza y acierto fuentes de información diversa,
        utiliza apoyos audiovisuales o gráficos, y sigue un guion previamente establecido
        para estructurar la información aplicando incorrectamente los procedimientos
        de Además, dificultades para comprender este tipo de textos, de manera que
        los resume aunque de manera fragmentada y con discriminar la información relevante,
        y con imprecisiones importantes: reconoce las distintas formas organización
        del discurso y analiza los recursos verbales no verbales empleados por el
        emisor, valorándolos función de los elementos de la situación comunicativa.
        Por último, a partir de la práctica habitual de la evaluación y la coevaluación,
        mejora manera superficial tanto sus producciones como las ajenas.'
      suficiente_bien: 'Planifica y produce con cierta pertinencia y autonomía textos
        orales expositivos y argumentativos sobre un tema polémico, en los que analiza,
        aunque de manera general, manifestando posturas enfrentadas, defendiendo una
        opinión mediante propia mediante argumentos relativamente convincentes. En
        estas producciones frecuentemente y con cierta conciencia de la importancia
        de estos aspectos: se expresa con claridad, precisión y corrección; respeta
        características gramaticales y la ortofonía de la norma culta del español
        de Canarias; adapta los elementos verbales y no verbales a las condiciones
        de la situación comunicativa; y emplea un léxico preciso y especializado,
        así como los recursos expresivos propios del registro formal. Para todo ello,
        con cierta destreza y acierto: consulta fuentes información diversa, utiliza
        apoyos audiovisuales gráficos, y sigue un guion obtenida, previamente establecido
        para estructurar la información cita. obtenida, aplicando demuestra correctamente
        procedimientos de Además, demuestra que comprende este tipo de textos, de
        manera que elabora algunos fallos en los que respecta a la cohesión y no discriminando
        siempre la de información relevante, y con algunas imprecisiones poco y importantes:
        reconoce las distintas formas de en organización del discurso y analiza los
        recursos verbales y emisor, no verbales empleados por el emisor, valorándolos
        en función de los elementos de la de situación comunicativa. Por último, a
        partir de la práctica habitual de la evaluación y la coevaluación, mejora
        con cierta deliberación tanto sus producciones como las ajenas.'
      notable: 'Planifica, y produce con bastante pertinencia autonomía textos expositivos
        y argumentativos sobre un tema polémico, en los que analiza con cierta profundidad
        enfrentadas, defendiendo una opinión propia argumentos convincentes. En producciones
        casi siempre y con bastante conciencia de la importancia de estos aspectos:
        se expresa con claridad, las precisión y corrección; respeta las características
        gramaticales y la ortofonía de la norma culta del español de Canarias; adapta
        los elementos verbales y no verbales a las condiciones de la situación comunicativa;
        y emplea un léxico preciso y especializado, así como los recursos expresivos
