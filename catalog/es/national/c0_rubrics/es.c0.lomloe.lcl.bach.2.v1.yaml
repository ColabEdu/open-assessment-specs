  - id: '4'
    name: Criterio 4
    description: 'Comprender, analizar y comentar textos expositivos y argumentativos
      propios las redes y medios de comunicación social, aplicando los conocimientos
      sobre el funcionamiento de la lengua, resumiendo su contenido, diferenciando
      la idea principal y explicando el modo de organización de las ideas en cada
      tipología; reconociendo los rasgos formales del género y relacionando sus características
      expresivas y sus usos lingüísticos con la intención del emisor y con el resto
      de los elementos de la situación comunicativa, para finalmente aplicar estos
      conocimientos en la composición de textos escritos, sobre temas relacionados
      con la actualidad social y cultural, reconociendo, en la reflexión sobre los
      procesos de producción y recepción de un texto, la importancia que para su comprensión
      tienen los conocimientos previos que se poseen a partir de lecturas anteriores
      que se relacionan con él, en la búsqueda de una mejora permanente de la interpretación
      y producción autónoma de textos orales y escritos. Este criterio permitirá evaluar
      si el alumnado comprende, sintetiza, analiza y comenta textos de carácter expositivo
      y argumentativo propios del ámbito periodístico y de las redes de comunicación
      social, resumiendo el contenido, identificando la intención comunicativa del
      emisor, diferenciando las ideas principales de las secundarias y distinguiendo
      las diferentes formas de estructurar los discursos. Además, se pretende comprobar
      si el alumnado reconoce, explica y aplica las características lingüísticas y
      los recursos expresivos: reconoce, describe y explica los recursos que proporcionan
      coherencia, cohesión y adecuación a este tipo de textos, ya sean morfosintácticos
      (sustitución pronominal, uso reiterado de determinadas estructuras sintácticas,   correlación    temporal,…),       léxico-
      semánticos (sustitución por sinónimos, hipónimos e hiperónimos, reiteraciones
      léxicas…) o pragmático- textuales (aspectos extralingüísticos), al igual que
      los indirecto libre y cita encubierta), utilizando en el proceso la terminología
      gramatical adecuada, poniendo de manifiesto la relación de estos elementos con
      la intención comunicativa del emisor y con los rasgos propios del género textual,
      y reconociendo y explicando, en la revisión para la mejora de textos propios
      y ajenos, incorrecciones (concordancias, régimen       verbal,     ambigüedades      sintácticas,
      coloquialismos, etc.). Asimismo, se comprobará si los alumnos y las alumnas
      son capaces identificar y explicar la intertextualidad en la recepción o producción
      de textos, expresando sus experiencias lectoras de obras de diferente tipo,
      género, etc. y sus experiencias personales, relacionándolas con el nuevo texto
      para llegar a una mejor comprensión e interpretación del mismo. De esta manera,
      aplicará sus conocimientos y conclusiones en la producción individual de textos
      argumentativos y expositivos relacionados      con    la    actualidad   social    y
      cultural(comentarios de texto, breves ensayos, artículos de opinión…), presentados
      en soporte papel o digital (diarios escolares, blogs, vlogs…) usando el registro
      adecuado a la intención comunicativa, organizando los enunciados en secuencias
      lineales cohesionadas y respetando las normas ortográficas y gramaticales, con
      objeto de mejorar la expresión escrita y avanzar en el aprendizaje autónomo.'
    levels:
      insuficiente: Analiza de manera superficial y comenta con poco rigor y claridad
        textos periodísticos escritos de carácter expositivo y argumentativo propios
