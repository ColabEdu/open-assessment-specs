  - id: '5'
    name: Criterio 5
    description: Realizar trabajos académicos de investigación sobre temas del currículo
      o aspectos polémicos de la actualidad social, científica y cultural, en un proceso
      integral y planificado de manera autónoma, que le permita reconocer cuándo necesita
      información, buscarla, gestionarla, evaluarla y comunicarla de forma adecuada
      al contexto,     prestando especial atención al hecho de contrastar opiniones
      enfrentadas y aportando un punto de vista personal, crítico y riguroso en la
      argumentación de sus propias opiniones. Aplicar las normas de presentación este
      tipo de trabajos y mostrar respeto con la propiedad intelectual de las fuentes
      consultadas. Utilizar las tecnologías de la información y la comunicación para
      la realización, evaluación y mejora del contenido y de la expresión lingüística
      de estas producciones. Todo ello para propiciar un proceso de aprendizaje continuo
      y para toda la vida. Se pretende comprobar que el alumnado, individualmente
      o de forma cooperativa, consulta fuentes de información variadas en contextos
      sociales o académicos, para la realización de trabajos de investigación sobre
      temas del currículo y de aspectos controvertidos de la actualidad social, científica
      o cultural. Se verificará que es capaz de planificar su realización, fijando
      sus propios objetivos, organizando la información en función de un orden predefinido,
      contrastando posturas enfrentadas y llegando a conclusiones personales, para
      cuya defensa utiliza distintos tipos de argumentos. Se constatará asimismo que
      es capaz de revisar el proceso de escritura para mejorar el producto final,
      respetando las normas establecidas en la presentación de trabajos (organización
      en epígrafes, procedimientos de cita, notas a pie de páginas, bibliografía…).
      Se comprobará también que utiliza las tecnologías de la información y la comunicación
      para documentarse de forma libre, consultando fuentes diversas, evaluando, contrastando,
      seleccionando y organizando la información relevante mediante fichas-resumen.
      Se valorará, además, la creatividad y la adecuación al contexto, académico o
      social, en la difusión de nuevos aprendizajes, la aportación de un punto de
      vista personal y crítico en sus producciones, y el rigor, la claridad y la coherencia
      en la expresión, así como la manifestación de una actitud ética y respetuosa
      con la objetividad o subjetividad de los contenidos, afianzando así, para su
      futuro académico, los conocimientos que irá adquiriendo mediante su propia experiencia
      informacional.
    levels:
      insuficiente: Planifica y realiza, aunque no siempre de manera pertinente y
        con un desarrollo que necesita ampliación, trabajos de investigación en los
        que respeta las normas establecidas para la presentación de este tipo de producciones.
        De esta manera, orientaciones durante proceso , fija sus propios objetivos,
        organiza información en función de un orden predefinido, contrasta posturas
        enfrentadas, llegando conclusiones personales mostrando inseguridad en la
