        relacionarlos con experiencias lectoras personales previas. De esta manera,
        elabora resúmenes de estos poco cohesionados e incompletos e identifica con
        errores importantes el tema, la estructura, la intención comunicativa y las
        ideas principales y secundarias. Además le cuesta reconocer y explicar los
        lingüísticos y expresivos que proporcionan cohesión y adecuación a este tipo
