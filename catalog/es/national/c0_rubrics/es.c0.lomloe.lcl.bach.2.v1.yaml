        con la expresión de la objetividad y subjetividad en el análisis y presentación
        de los contenidos.
      notable: Planifica y realiza, de forma pertinente y con un adecuado desarrollo,
        trabajos investigación en los que respeta las normas establecidas para la
        presentación de este tipo de producciones. De esta manera, con autonomía,
        fija sus propios objetivos, organiza la la información en función de un orden
        predefinido, contrasta posturas enfrentadas, llegando a conclusiones personales
        y exponiéndolas con distintos tipos de argumentos con seguridad y claridad;
